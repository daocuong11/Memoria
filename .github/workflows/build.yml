name: Build Installers

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test + build
        run: npm test
      - name: UI audit
        run: npm run check:ui
      - name: Version consistency
        run: npm run check:versions
      - name: Verify tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./package.json').version")
          expected="v${version}"
          if [ "${GITHUB_REF_NAME}" != "${expected}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} tidak cocok dengan package.json (${expected}). Bump versi dulu."
            exit 1
          fi

  npm:
    # Publish the CLI/headless engine to npm on every v* tag via npm trusted
    # publishing (GitHub OIDC): no NPM_TOKEN secret. Configure once on
    # npmjs.com → package Settings → Trusted Publisher → GitHub Actions
    # (owner xinzzu, repo Memoria, workflow build.yml).
    needs: verify
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Use npm with trusted publishing support (>= 11.5.1)
        run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm run build
      - name: Publish (skip if this version is already on npm)
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "${name}@${version} is already published, skipping."
            exit 0
          fi
          npm publish --access public

  mcp-registry:
    # Publish server.json to the official MCP Registry after npm, using GitHub
    # OIDC (no token). The registry checks `mcpName` in the published npm
    # package, so this waits until the new version is visible on npm.
    needs: npm
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.12
    steps:
      - uses: actions/checkout@v4
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
      - name: Wait for the npm version
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          for i in $(seq 1 30); do
            if npm view "${name}@${version}" mcpName >/dev/null 2>&1; then exit 0; fi
            sleep 10
          done
          echo "::error::${name}@${version} not visible on npm after 5 minutes"
          exit 1
      - name: Publish (skip if this version is already listed)
        run: |
          version=$(node -p "require('./server.json').version")
          name=$(node -p "require('./server.json').name")
          if curl -fsS "https://registry.modelcontextprotocol.io/v0/servers?search=${name}" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.exit(JSON.parse(s).servers.some(x=>x.server.version===process.argv[1])?0:1))" "$version"; then
            echo "${name}@${version} is already in the MCP Registry, skipping."
            exit 0
          fi
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
  build:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-latest
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build installer
        run: npx electron-builder --publish never
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: memoria-${{ matrix.os }}
          path: |
            dist-installer/*.exe
            dist-installer/*.AppImage
            dist-installer/*.deb
            dist-installer/*.dmg
            dist-installer/*.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compose release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          prev=$(git tag --sort=-version:refname | awk -v cur="${GITHUB_REF_NAME}" '$0 != cur { print; exit }')
          section=$(awk -v ver="${version}" '
            index($0, "## [" ver "]") == 1 { found=1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md)
          # Body rilis = section CHANGELOG (kurasi) + riwayat commit per-tag
          # (format "- subject (sha)") — keduanya selalu tampil.
          {
            printf '## Memoria %s\n\n' "${GITHUB_REF_NAME}"
            if [ -n "${section}" ]; then printf '%s\n' "${section}"; fi
            printf '\n### Changes since %s\n\n' "${prev:-the beginning}"
            if [ -z "${prev}" ]; then
              git log --pretty=format:"- %s (%h)" --no-merges "${GITHUB_REF_NAME}" --max-count=100
            else
              git log --pretty=format:"- %s (%h)" --no-merges "${prev}..${GITHUB_REF_NAME}"
            fi
            echo
          } > release-body.md
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Memoria ${{ github.ref_name }}
          body_path: release-body.md
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: false
